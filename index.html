<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Cine Privado 🎬</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px 10px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 15px 0; color: #ff79c6; text-shadow: 0px 2px 4px rgba(0,0,0,0.5); }
        .sala-cine { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 12px; }
        
        .contenedor-video {
            width: 100%; aspect-ratio: 16 / 9;
            background: #000000; border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.6); overflow: hidden;
        }
        #player { width: 100%; height: 100%; border: none; }
        
        /* Panel para Cambiar Video en Vivo */
        .panel-cambiar-video {
            display: flex; gap: 10px; width: 100%; background: #1e1e1e;
            padding: 10px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }
        .panel-cambiar-video input {
            flex: 1; background: #2a2a2a; border: 1px solid #444; padding: 10px;
            border-radius: 8px; color: white; outline: none; font-size: 0.9rem;
        }
        .panel-cambiar-video button {
            background: #ff79c6; color: #121212; border: none; padding: 0 15px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }

        /* Estructura del Chat */
        .contenedor-chat {
            width: 100%; background: #1e1e1e; border-radius: 12px;
            display: flex; flex-direction: column; height: 300px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4); overflow: hidden;
        }
        .pantalla-mensajes {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .mensaje {
            background: #2a2a2a; padding: 8px 12px; border-radius: 8px;
            font-size: 0.9rem; max-width: 85%; align-self: flex-start;
            word-break: break-word;
        }
        .msg-yo { align-self: flex-end; background: #ff79c6; color: #121212; }
        .area-input { display: flex; padding: 10px; background: #151515; gap: 10px; }
        .area-input input {
            flex: 1; background: #2a2a2a; border: none; padding: 12px;
            border-radius: 8px; color: white; outline: none; font-size: 0.95rem;
        }
        .area-input button {
            background: #ff79c6; color: #121212; border: none; padding: 0 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎬 Sala de Cine de Caro</h1>

    <div class="sala-cine">
        <div class="contenedor-video">
            <div id="player"></div>
        </div>

        <div class="panel-cambiar-video">
            <input type="text" id="url-video" placeholder="Pega aquí el link de YouTube...">
            <button id="btn-cambiar-video">Cambiar video</button>
        </div>

        <div class="contenedor-chat">
            <div class="pantalla-mensajes" id="chat-box"></div>
            <div class="area-input">
                <input type="text" id="message-input" placeholder="Escribe un mensaje aquí...">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const miNombre = prompt("Introduce tu nombre para el cine:") || "Invitada";

        // TUS CREDENCIALES DE FIREBASE (YA CONFIGURADAS)
        const firebaseConfig = {
            apiKey: "AIzaSyB_en_iCNtBhIyDczHAka1oxUel6c7hvbo",
            authDomain: "cinecito-c36b3.firebaseapp.com",
            databaseURL: "https://cinecito-c36b3-default-rtdb.firebaseio.com",
            projectId: "cinecito-c36b3",
            storageBucket: "cinecito-c36b3.appspot.com",
            messagingSenderId: "41821063218",
            appId: "1:41821063218:web:a18b16f0ca4f003167142b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const chatRef = database.ref('cine/chat');
        const videoRef = database.ref('cine/videoState');
        const currentVideoRef = database.ref('cine/currentVideoId');

        let player;
        let ignorarEventosLocales = false;
        let actualVideoId = 'S0Z8Z7-NszA'; // Video inicial por defecto

        function onYouTubeIframeAPIReady() {
            currentVideoRef.on('value', (snapshot) => {
                const idFromDb = snapshot.val();
                if (!idFromDb) return;
                
                actualVideoId = idFromDb;
                
                if (!player) {
                    player = new YT.Player('player', {
                        videoId: actualVideoId,
                        playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0 },
                        events: { 'onStateChange': onPlayerStateChange }
                    });
                } else {
                    player.loadVideoById(actualVideoId);
                }
            });
        }

        // CONTROLADOR DE EVENTOS LOCALES (Solo envía si te llamas "Caro")
        function onPlayerStateChange(event) {
            if (ignorarEventosLocales) return; 

            if (miNombre.trim().toLowerCase() === 'caro') {
                videoRef.set({
                    estado: event.data,
                    tiempo: player.getCurrentTime(),
                    usuarioHost: miNombre,
                    trigger: Date.now()
                });
            }
        }

        // RECEPTOR DE COMANDOS (Sincronización automática sin bucles)
        videoRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data || !player || !player.getPlayerState) return;

            // Si eres tú misma ("Caro"), ignora la orden para evitar trabas en tu compu
            if (miNombre.trim().toLowerCase() === 'caro') return;

            // Bloqueo temporal para el iPhone de ella
            ignorarEventosLocales = true;

            // Sincronizar la línea de tiempo si se desfasa por más de 2 segundos
            if (Math.abs(player.getCurrentTime() - data.tiempo) > 2) {
                player.seekTo(data.tiempo, true);
            }

            // Forzar Play o Pausa físico en su pantalla
            if (data.estado === YT.PlayerState.PLAYING && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                player.playVideo();
            } else if (data.estado === YT.PlayerState.PAUSED && player.getPlayerState() !== YT.PlayerState.PAUSED) {
                player.pauseVideo();
            }

            // Volvemos a activar la escucha local después de la estabilización
            setTimeout(() => { ignorarEventosLocales = false; }, 800);
        });

        // FUNCIONALIDAD PARA CAMBIAR VIDEO EN EL MOMENTO
        document.getElementById('btn-cambiar-video').addEventListener('click', cambiarVideoGlobal);
        
        function cambiarVideoGlobal() {
            const urlInput = document.getElementById('url-video').value.trim();
            if (!urlInput) return;

            let videoId = urlInput;
            
            // Filtro interactivo para limpiar enlaces de YouTube
            if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = urlInput.match(regExp);
                if (match && match[2].length === 11) {
                    videoId = match[2];
                }
            }

            currentVideoRef.set(videoId);
            document.getElementById('url-video').value = "";
        }

        // LÓGICA DEL CHAT
        document.getElementById('send-btn').addEventListener('click', enviarMensaje);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        function enviarMensaje() {
            const input = document.getElementById('message-input');
            if (input.value.trim() !== "") {
                chatRef.push({
                    autor: miNombre,
                    texto: input.value,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = "";
            }
        }

        chatRef.limitToLast(40).on('child_added', (snapshot) => {
            const msg = snapshot.val();
            const chatBox = document.getElementById('chat-box');
            const nuevoMensaje = document.createElement('div');
            nuevoMensaje.classList.add('mensaje');
            
            if(msg.autor === miNombre) nuevoMensaje.classList.add('msg-yo');
            nuevoMensaje.innerHTML = `<strong>${msg.autor}:</strong> ${msg.texto}`;
            
            chatBox.appendChild(nuevoMensaje);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
